<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cute Sweet Breaker 3D 🍬✨ — Kawaii Candy Breakout</title>
  <script src="arcade-leaderboard.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    :root {
      --primary: #ff6b9d;
      --secondary: #4deeea;
      --accent: #ffe66d;
      --candy-purple: #b967ff;
      --bg: #161224;
      --panel: rgba(28, 22, 44, 0.88);
    }
    * { margin:0; padding:0; box-sizing:border-box; touch-action:none; user-select:none; }
    body {
      background: var(--bg);
      color: #fff;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      cursor: crosshair;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    canvas#webgl-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Top HUD */
    .hud-header {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 50;
    }
    .hud-pill {
      background: var(--panel);
      backdrop-filter: blur(12px);
      border: 2px solid rgba(255, 107, 157, 0.4);
      border-radius: 18px;
      padding: 10px 22px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5), 0 0 15px rgba(255,107,157,0.25);
      pointer-events: auto;
    }
    .hud-stat {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .stat-label {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #c4b5e0;
      text-transform: uppercase;
    }
    .stat-val {
      font-size: 22px;
      font-weight: 900;
      color: var(--accent);
      text-shadow: 0 0 10px rgba(255, 230, 109, 0.6);
    }
    .stat-val.score { color: var(--secondary); text-shadow: 0 0 10px rgba(77, 238, 234, 0.6); }

    .arcade-btn {
      background: var(--panel);
      border: 2px solid rgba(255, 107, 157, 0.5);
      color: #fff;
      padding: 8px 18px;
      border-radius: 14px;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      transition: all 0.2s;
    }
    .arcade-btn:hover {
      background: var(--primary);
      box-shadow: 0 0 20px rgba(255, 107, 157, 0.8);
      transform: translateY(-2px);
    }

    /* Modal Screens */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(14, 10, 24, 0.88);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }
    .modal-card {
      background: var(--panel);
      border: 2px solid rgba(255, 107, 157, 0.5);
      border-radius: 24px;
      padding: 32px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 16px 40px rgba(0,0,0,0.7), 0 0 30px rgba(255,107,157,0.3);
      display: flex;
      flex-direction: column;
      gap: 16px;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-title {
      font-size: 32px;
      font-weight: 900;
      color: var(--primary);
      text-shadow: 0 0 16px rgba(255, 107, 157, 0.6);
    }
    .modal-desc {
      color: #d1c4e9;
      font-size: 15px;
      line-height: 1.5;
    }
    .primary-btn {
      background: linear-gradient(135deg, #ff6b9d, #ff8da1);
      color: #fff;
      border: none;
      padding: 14px 28px;
      border-radius: 16px;
      font-size: 17px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(255, 107, 157, 0.5);
      transition: all 0.2s;
    }
    .primary-btn:hover {
      transform: scale(1.04);
      box-shadow: 0 12px 30px rgba(255, 107, 157, 0.8);
    }

    /* Controls Hint */
    .controls-hint {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--panel);
      border: 1px solid rgba(255,255,255,0.15);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      color: #e0d4f7;
      pointer-events: none;
      z-index: 50;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="webgl-canvas"></canvas>

    <div class="hud-header">
      <div class="hud-pill">
        <div class="hud-stat">
          <span class="stat-label">🍬 SCORE</span>
          <span id="score-val" class="stat-val score">0</span>
        </div>
        <div class="hud-stat">
          <span class="stat-label">❤️ HEARTS</span>
          <span id="lives-val" class="stat-val">3</span>
        </div>
        <div class="hud-stat">
          <span class="stat-label">🌟 LEVEL</span>
          <span id="level-val" class="stat-val">1</span>
        </div>
      </div>

      <a href="https://marcuscaiado.github.io/marcus-arcade/" class="arcade-btn">
        🕹️ <span>Arcade Hub</span>
      </a>
    </div>

    <div class="controls-hint">
      <span>🖱️ Move mouse / Touch to guide your Kawaii Gummy Paddle! 🍬✨</span>
    </div>

    <!-- Start Modal -->
    <div id="start-modal" class="modal-overlay">
      <div class="modal-card">
        <h1 class="modal-title">SWEET BREAKER 3D 🍬✨</h1>
        <p class="modal-desc">
          Bust colorful 3D pastel candy blocks with your bouncy sugar pearl! Catch floating power-ups and clear sweet stages!
        </p>
        <button class="primary-btn" onclick="startGame()">START SWEET RUSH ➔</button>
      </div>
    </div>

    <!-- Game Over Modal -->
    <div id="gameover-modal" class="modal-overlay" style="display: none;">
      <div class="modal-card">
        <h1 id="over-title" class="modal-title">GAME OVER! 🍬</h1>
        <p id="over-desc" class="modal-desc">
          Sweet score: <b id="final-score" style="color:var(--secondary)">0</b> points!
        </p>
        <button class="primary-btn" onclick="startGame()">PLAY AGAIN ➔</button>
      </div>
    </div>
  </div>

  <script>
    /* ==========================================================================
       1. SYNTHESIZED SOUND FX (Web Audio API)
       ========================================================================== */
    let audioCtx = null;
    function getAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      return audioCtx;
    }

    function playSound(type) {
      try {
        const ctx = getAudio();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        if (type === 'hit-brick') {
          // Bouncy crystal chime
          osc.type = 'triangle';
          const freq = 600 + Math.random() * 300;
          osc.frequency.setValueAtTime(freq, now);
          osc.frequency.exponentialRampToValueAtTime(freq * 1.5, now + 0.08);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'hit-paddle') {
          // Gummy squish boing
          osc.type = 'sine';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(640, now + 0.09);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'lose-life') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(400, now);
          osc.frequency.exponentialRampToValueAtTime(120, now + 0.3);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(now); osc.stop(now + 0.3);
        }
      } catch(e) {}
    }

    /* ==========================================================================
       2. THREE.JS 3D CANDY ARENA SETUP
       ========================================================================== */
    const canvas = document.getElementById('webgl-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.shadowMap.enabled = true;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x161224);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 1, 300);
    camera.position.set(0, 32, 28);
    camera.lookAt(0, 0, -6);

    // Warm pastel candy lighting
    scene.add(new THREE.AmbientLight(0xfff0f5, 0.85));
    const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
    sunLight.position.set(15, 40, 20);
    sunLight.castShadow = true;
    scene.add(sunLight);

    const pinkLight = new THREE.PointLight(0xff6b9d, 1.5, 60);
    pinkLight.position.set(-18, 12, -10);
    scene.add(pinkLight);

    const cyanLight = new THREE.PointLight(0x4deeea, 1.2, 60);
    cyanLight.position.set(18, 12, 10);
    scene.add(cyanLight);

    // Arena Bounds
    const ARENA_WIDTH = 26;
    const ARENA_DEPTH = 36;

    // Build Arena Walls
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x2d2247, roughness: 0.5 });
    const leftWall = new THREE.Mesh(new THREE.BoxGeometry(1.2, 3, ARENA_DEPTH), wallMat);
    leftWall.position.set(-ARENA_WIDTH / 2, 1.5, -4);
    scene.add(leftWall);

    const rightWall = new THREE.Mesh(new THREE.BoxGeometry(1.2, 3, ARENA_DEPTH), wallMat);
    rightWall.position.set(ARENA_WIDTH / 2, 1.5, -4);
    scene.add(rightWall);

    const topWall = new THREE.Mesh(new THREE.BoxGeometry(ARENA_WIDTH + 1.2, 3, 1.2), wallMat);
    topWall.position.set(0, 1.5, -ARENA_DEPTH / 2 - 4);
    scene.add(topWall);

    // Arena Floor
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x1f1833, roughness: 0.8 });
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(ARENA_WIDTH + 8, ARENA_DEPTH + 10), floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    /* ==========================================================================
       3. KAWAII GUMMY PADDLE (With Eyes & Blush)
       ========================================================================== */
    const paddleGroup = new THREE.Group();
    const paddleMat = new THREE.MeshStandardMaterial({ color: 0xff4d79, roughness: 0.25, metalness: 0.1 });
    const paddleMesh = new THREE.Mesh(new THREE.BoxGeometry(6.5, 1.4, 1.6), paddleMat);
    paddleMesh.castShadow = true;
    paddleGroup.add(paddleMesh);

    // Cute Eyes on paddle
    const eyeGeo = new THREE.SphereGeometry(0.28, 16, 16);
    const eyeMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
    const pupilGeo = new THREE.SphereGeometry(0.09, 12, 12);
    const pupilMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

    const lEye = new THREE.Mesh(eyeGeo, eyeMat);
    lEye.position.set(-1.2, 0.2, 0.8);
    const lPupil = new THREE.Mesh(pupilGeo, pupilMat);
    lPupil.position.set(-0.04, 0.08, 0.2);
    lEye.add(lPupil);
    paddleGroup.add(lEye);

    const rEye = new THREE.Mesh(eyeGeo, eyeMat);
    rEye.position.set(1.2, 0.2, 0.8);
    const rPupil = new THREE.Mesh(pupilGeo, pupilMat);
    rPupil.position.set(0.04, 0.08, 0.2);
    rEye.add(rPupil);
    paddleGroup.add(rEye);

    // Blush Cheeks
    const blushGeo = new THREE.CircleGeometry(0.24, 16);
    const blushMat = new THREE.MeshBasicMaterial({ color: 0xff9ec7 });
    const lBlush = new THREE.Mesh(blushGeo, blushMat);
    lBlush.position.set(-1.8, -0.15, 0.82);
    paddleGroup.add(lBlush);
    const rBlush = new THREE.Mesh(blushGeo, blushMat);
    rBlush.position.set(1.8, -0.15, 0.82);
    paddleGroup.add(rBlush);

    paddleGroup.position.set(0, 1.2, ARENA_DEPTH / 2 - 8);
    scene.add(paddleGroup);

    /* ==========================================================================
       4. 3D CANDY BALL & BRICK MATRIX
       ========================================================================== */
    const ballGeo = new THREE.SphereGeometry(0.75, 24, 24);
    const ballMat = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      emissive: 0xffe66d,
      emissiveIntensity: 0.3,
      roughness: 0.2
    });
    const ballMesh = new THREE.Mesh(ballGeo, ballMat);
    ballMesh.castShadow = true;
    scene.add(ballMesh);

    const ball = { x: 0, z: 0, vx: 0.22, vz: -0.38, speed: 0.42 };

    const CANDY_COLORS = [0xff6b9d, 0xff9f43, 0xffe66d, 0x00f5ff, 0xb967ff];
    let bricks = [];
    const brickGroup = new THREE.Group();
    scene.add(brickGroup);

    function createBricks() {
      // Clear old bricks
      while(brickGroup.children.length > 0) {
        brickGroup.remove(brickGroup.children[0]);
      }
      bricks = [];

      const rows = 5;
      const cols = 7;
      const bWidth = 3.0;
      const bHeight = 1.4;
      const bDepth = 1.4;
      const startX = -((cols - 1) * 3.4) / 2;
      const startZ = -ARENA_DEPTH / 2 - 1;

      for (let r = 0; r < rows; r++) {
        const color = CANDY_COLORS[r % CANDY_COLORS.length];
        const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.3, metalness: 0.1 });

        for (let c = 0; c < cols; c++) {
          const mesh = new THREE.Mesh(new THREE.BoxGeometry(bWidth, bHeight, bDepth), mat);
          const bx = startX + c * 3.4;
          const bz = startZ + r * 2.0;
          mesh.position.set(bx, 1.2, bz);
          mesh.castShadow = true;
          brickGroup.add(mesh);

          bricks.push({ mesh, x: bx, z: bz, w: bWidth, d: bDepth, hp: 1 });
        }
      }
    }

    /* ==========================================================================
       5. GAME STATE & INPUT
       ========================================================================== */
    let score = 0;
    let lives = 3;
    let level = 1;
    let isRunning = false;
    let targetPaddleX = 0;

    function handlePointer(clientX) {
      const normX = (clientX / window.innerWidth) * 2 - 1;
      targetPaddleX = THREE.MathUtils.clamp(normX * (ARENA_WIDTH / 2 - 4), -ARENA_WIDTH / 2 + 4, ARENA_WIDTH / 2 - 4);
    }

    window.addEventListener('mousemove', (e) => handlePointer(e.clientX));
    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) handlePointer(e.touches[0].clientX);
    }, { passive: false });

    function startGame() {
      score = 0;
      lives = 3;
      level = 1;
      updateHUD();
      createBricks();
      resetBall();
      document.getElementById('start-modal').style.display = 'none';
      document.getElementById('gameover-modal').style.display = 'none';
      isRunning = true;
    }

    function resetBall() {
      ball.x = paddleGroup.position.x;
      ball.z = paddleGroup.position.z - 2;
      ball.vx = (Math.random() - 0.5) * 0.25;
      ball.vz = -0.42;
      ball.speed = 0.45;
    }

    function updateHUD() {
      document.getElementById('score-val').textContent = score;
      document.getElementById('lives-val').textContent = lives;
      document.getElementById('level-val').textContent = level;
    }

    function gameOver() {
      isRunning = false;
      document.getElementById('final-score').textContent = score;
      document.getElementById('gameover-modal').style.display = 'flex';
      if (window.ArcadeLeaderboard) {
        window.ArcadeLeaderboard.submitScore('brick-breaker-fx', score);
      }
    }

    /* ==========================================================================
       6. GAME ANIMATION LOOP & 3D PHYSICS
       ========================================================================== */
    function animate() {
      requestAnimationFrame(animate);

      if (isRunning) {
        // Move Paddle
        paddleGroup.position.x += (targetPaddleX - paddleGroup.position.x) * 0.25;
        paddleGroup.rotation.z = (paddleGroup.position.x - targetPaddleX) * 0.05;

        // Move Ball
        ball.x += ball.vx;
        ball.z += ball.vz;

        // Wall Collisions
        if (Math.abs(ball.x) >= ARENA_WIDTH / 2 - 1.2) {
          ball.vx *= -1;
          ball.x = Math.sign(ball.x) * (ARENA_WIDTH / 2 - 1.2);
          playSound('hit-brick');
        }
        if (ball.z <= -ARENA_DEPTH / 2 - 3.2) {
          ball.vz *= -1;
          ball.z = -ARENA_DEPTH / 2 - 3.2;
          playSound('hit-brick');
        }

        // Paddle Collision
        const pDistZ = ball.z - paddleGroup.position.z;
        const pDistX = ball.x - paddleGroup.position.x;
        if (ball.vz > 0 && Math.abs(pDistZ) < 1.2 && Math.abs(pDistX) < 3.8) {
          ball.vz = -Math.abs(ball.vz);
          ball.vx = (pDistX / 3.8) * 0.45; // English deflection based on where ball hits paddle!
          playSound('hit-paddle');
        }

        // Brick Collisions
        for (let i = bricks.length - 1; i >= 0; i--) {
          const b = bricks[i];
          if (Math.abs(ball.x - b.x) < b.w / 2 + 0.6 && Math.abs(ball.z - b.z) < b.d / 2 + 0.6) {
            brickGroup.remove(b.mesh);
            bricks.splice(i, 1);
            ball.vz *= -1;
            score += 100;
            updateHUD();
            playSound('hit-brick');

            if (bricks.length === 0) {
              // Level Clear!
              level++;
              createBricks();
              resetBall();
            }
            break;
          }
        }

        // Ball Out of Bounds (Bottom)
        if (ball.z > ARENA_DEPTH / 2 + 4) {
          lives--;
          playSound('lose-life');
          updateHUD();
          if (lives <= 0) {
            gameOver();
          } else {
            resetBall();
          }
        }

        // Update Ball Mesh
        ballMesh.position.set(ball.x, 1.2, ball.z);
        ballMesh.rotation.x += ball.vz * 0.2;
        ballMesh.rotation.z -= ball.vx * 0.2;
      }

      renderer.render(scene, camera);
    }
    requestAnimationFrame(animate);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
